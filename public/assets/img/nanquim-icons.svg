    <g id="draw" transform="translate(168 120)">
      <path d="M6 3h8l3 4-5 14H8L3 7zM10 12v9M7 7h10"/>
      <circle cx="10" cy="10" r="1.25"/>
      <path d="M17 15h4M19 13v4"/>
    </g>

    <!-- Row 6: Paper and Properties tabs. -->
    <g id="paper" transform="translate(0 144)">
      <path d="M5 3h12l3 3v15H5zM17 3v4h3"/>
      <rect x="8" y="10" width="9" height="7"/>
      <path d="M3 8h4M3 16h4"/>
    </g>
    <g id="styles" transform="translate(24 144)">
      <path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11Z"/>
      <path d="M9 15a3 3 0 0 0 3 2"/>
    </g>
    <g id="dimensions" transform="translate(48 144)">
      <path d="M4 7v10M20 7v10M4 12h16M7 9l-3 3 3 3M17 9l3 3-3 3"/>
      <path d="M8 18h8"/>
    </g>
    <g id="text" transform="translate(72 144)">
      <path d="M5 5h14M12 5v14M8 19h8"/>
      <path d="M4 3v5M20 3v5"/>
    </g>
    <g id="rename" transform="translate(96 144)">
      <path d="m5 16-1 4 4-1L19 8l-3-3zM14 7l3 3"/>
      <path d="M4 12V4h8M11 20h9v-8" opacity=".65"/>
    </g>
    <g id="transform" transform="translate(120 144)">
      <rect x="6" y="6" width="12" height="12"/>
      <path d="M12 2v20M2 12h20M10 4l2-2 2 2M20 10l2 2-2 2"/>
      <circle cx="12" cy="12" r="1.5" fill="#fff" stroke="none"/>
    </g>
    <g id="constraints" transform="translate(144 144)">
      <path d="M4 19V5h14v14zM4 19 18 5"/>
      <rect x="14" y="13" width="7" height="7" rx="1"/>
      <path d="M16 13v-2a1.5 1.5 0 0 1 3 0v2"/>
    </g>
    <g id="collection-add" transform="translate(168 144)">
      <path d="m3 7 7-3 7 3-7 3ZM3 11l7 3 4-1.7M3 15l7 3 3-1.3"/>
      <path d="M18 12v8M14 16h8"/>
    </g>

    <!-- Row 7: explicit enabled variants. -->
    <g id="retain-on" transform="translate(0 168)">
      <path d="M7 4h10v16l-5-3-5 3z" fill="#fff"/>
    </g>
    <g id="pin-on" transform="translate(24 168)">
      <path d="m8 4 8 3-2 4 4 4-5 1-3 5-1-6-4-4 5-2z" fill="#fff"/>
      <path d="m10 14-6 6"/>
    </g>
    <g id="selected-on" transform="translate(48 168)">
      <circle cx="12" cy="12" r="9"/>
      <path d="m7 12 3 3 7-7" stroke-width="2"/>
