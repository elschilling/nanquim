      <circle cx="12" cy="7" r="1" fill="#fff" stroke="none"/>
    </g>
    <g id="pin" transform="translate(144 72)">
      <path d="m8 4 8 3-2 4 4 4-5 1-3 5-1-6-4-4 5-2z"/>
