      <path d="m8 5 8 7-8 7"/>
      <circle cx="4" cy="12" r="1" fill="#fff" stroke="none"/>
    </g>
    <g id="dots" transform="translate(24 72)" fill="#fff" stroke="none">
      <circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>
    </g>
    <g id="retain" transform="translate(48 72)">
      <path d="M7 4h10v16l-5-3-5 3z"/>
      <path d="M10 8h4"/>
    </g>
    <g id="duplicate" transform="translate(72 72)">
