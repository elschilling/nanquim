    <g id="properties" transform="translate(120 120)">
      <path d="M4 6h16M4 12h16M4 18h16"/>
      <circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/>
    </g>
    <g id="terminal" transform="translate(144 120)">
