    <g id="block" transform="translate(0 24)">
      <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>
      <path d="M10 7h4M7 10v4M17 10v4M10 17h4"/>
    </g>
    <g id="line" transform="translate(24 24)">
      <path d="m5 18 14-12"/>
