    <g id="mute-on" transform="translate(72 168)">
      <path d="M4 10h4l5-4v12l-5-4H4z" fill="#fff"/>
      <path d="M16 9a4 4 0 0 1 0 6M19 7a7 7 0 0 1 0 10"/>
    </g>
    <g id="collapse-on" transform="translate(96 168)">
      <path d="m5 8 7 8 7-8"/>
      <circle cx="12" cy="4" r="1" fill="#fff" stroke="none"/>
    </g>
  </g>
</svg>
