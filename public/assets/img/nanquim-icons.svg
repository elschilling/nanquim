    <!-- Row 4: search, visibility, and locking. -->
    <g id="mute" transform="translate(0 96)">
      <path d="M4 10h4l5-4v12l-5-4H4zM17 9l4 6M21 9l-4 6"/>
    </g>
    <g id="search" transform="translate(24 96)">
      <circle cx="10.5" cy="10.5" r="6.5"/>
      <path d="m15.5 15.5 5 5M7 10.5h7"/>
