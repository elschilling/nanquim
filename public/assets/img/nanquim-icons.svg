    <g id="modifier" transform="translate(24 120)">
      <path d="M14 4a5 5 0 0 0-5 6L3.5 15.5a2 2 0 0 0 3 3L12 13a5 5 0 0 0 6-6l-3 3-3-3z"/>
    </g>
    <g id="decimate" transform="translate(48 120)">
