      <circle cx="12" cy="12" r="3"/>
    </g>
    <g id="eye" transform="translate(96 96)">
      <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
      <path d="m9.5 12 1.7 1.7 3.5-4"/>
