    <g id="nodes" transform="translate(72 120)">
      <path d="M7 7h4M13 7h4M7 17h10M12 7v10"/>
      <circle cx="5" cy="7" r="2"/><circle cx="19" cy="7" r="2"/>
      <rect x="9" y="5" width="6" height="4" rx="1"/>
      <circle cx="5" cy="17" r="2"/><circle cx="19" cy="17" r="2"/>
    </g>
    <g id="triangulate" transform="translate(96 120)">
      <path d="M4 19 12 4l8 15ZM4 19l8-7 8 7M12 4v8"/>
      <circle cx="12" cy="12" r="1.25"/>
