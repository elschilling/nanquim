      <rect x="17.5" y="4.5" width="3" height="3"/>
      <path d="M8 18h9" stroke-dasharray="1.5 2.5"/>
    </g>
    <g id="circle" transform="translate(48 24)">
      <circle cx="12" cy="12" r="7.5"/>
      <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
      <circle cx="12" cy="12" r="1.25"/>
    </g>
    <g id="arc" transform="translate(72 24)">
      <path d="M5 17A9 9 0 0 1 19 7"/>
      <rect x="3.5" y="15.5" width="3" height="3"/>
      <rect x="17.5" y="5.5" width="3" height="3"/>
      <path d="M12 12h.01"/>
    </g>
    <g id="rectangle" transform="translate(96 24)">
      <rect x="4" y="5" width="16" height="14" rx=".5"/>
      <path d="M2 8h4M18 8h4M8 3v4M8 17v4"/>
