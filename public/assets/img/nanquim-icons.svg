<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <title>Nanquim interface icon mask sheet</title>
  <desc>Project-authored technical drafting icons arranged in an eight by eight grid of 24 pixel cells.</desc>
  <g fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <!-- Row 0: brand, files, and document structure. -->
    <g id="nib" transform="translate(0 0)">
      <path d="M12 2.5 19 9l-4.5 11h-5L5 9Z"/>
      <path d="M8 6h8M12 12v8"/>
      <circle cx="12" cy="10" r="1.4"/>
    </g>
    <g id="canvas" transform="translate(24 0)">
      <path d="M5 4h14v16H5zM3 8h4M17 8h4M9 2v4M9 18v4"/>
      <path d="m8 16 3-4 2 2 3-5"/>
    </g>
    <g id="folder" transform="translate(48 0)">
      <path d="M3 7h7l2 2h9v11H3zM3 10h18"/>
      <path d="M6 15h10"/>
    </g>
    <g id="recent" transform="translate(72 0)">
      <path d="M5.5 7.5A8 8 0 1 1 4 13"/>
      <path d="M2.5 7.5h3v-3M12 7v5l3 2"/>
    </g>
    <g id="outliner" transform="translate(96 0)">
      <path d="M6 5v14M6 8h5M6 16h5M11 8v4h5"/>
      <rect x="3.5" y="3.5" width="5" height="4" rx=".75"/>
      <rect x="11" y="6" width="7" height="4" rx=".75"/>
      <rect x="16" y="10" width="5" height="4" rx=".75"/>
      <rect x="11" y="14" width="7" height="4" rx=".75"/>
    </g>
    <g id="plus" transform="translate(120 0)">
