    <g id="snap" transform="translate(24 48)">
      <path d="M7 4v7a5 5 0 0 0 10 0V4M7 8h4M13 8h4"/>
      <path d="M3 18h6M6 15v6M18 15v6M15 18h6"/>
    </g>
    <g id="snap-options" transform="translate(48 48)">
      <path d="M4 6h16M4 12h16M4 18h16"/>
      <circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/>
    </g>
    <g id="close" transform="translate(72 48)">
