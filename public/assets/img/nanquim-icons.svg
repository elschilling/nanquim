      <path d="m4 12 8 4 8-4M4 16l8 4 8-4"/>
    </g>
    <g id="group" transform="translate(168 0)">
      <path d="M6 5H3v14h3M18 5h3v14h-3M7 12h10"/>
      <circle cx="8" cy="12" r="2"/>
      <circle cx="16" cy="12" r="2"/>
    </g>

