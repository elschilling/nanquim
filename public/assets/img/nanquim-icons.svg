      <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>
    </g>
    <g id="unlock" transform="translate(168 96)">
      <rect x="5" y="10" width="14" height="11" rx="1"/>
      <path d="M16 7a4 4 0 0 0-8 0M12 14v3"/>
    </g>

