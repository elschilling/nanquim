name: Browser qualification

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  release:
    types:
      - prereleased

permissions:
  contents: read

concurrency:
  group: browser-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium ${{ matrix.channel }} workflows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            version: stable
          # Refresh this major at each release boundary so it remains the
          # immediately preceding stable Chromium named by the support policy.
          - channel: previous-stable
            version: '150'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 8.15.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install Chromium ${{ matrix.channel }}
        id: setup-chromium
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: ${{ matrix.version }}
          install-dependencies: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Chromium workflows
        run: pnpm test:browser:chromium
        env:
          NANQUIM_BROWSER_EXECUTABLE: ${{ steps.setup-chromium.outputs.chrome-path }}
          NANQUIM_BROWSER_ARTIFACTS: test-results/browser/chromium-${{ matrix.channel }}

      - name: Preserve Chromium failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-chromium-${{ matrix.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser/chromium-${{ matrix.channel }}/
          if-no-files-found: ignore
          retention-days: 14

  firefox:
    name: Firefox ${{ matrix.channel }} workflows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            version: latest
          - channel: esr
            version: latest-esr

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 8.15.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install Firefox ${{ matrix.channel }}
        id: setup-firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: ${{ matrix.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Firefox browser workflows
        run: pnpm test:browser:firefox
        env:
          NANQUIM_BROWSER_EXECUTABLE: ${{ steps.setup-firefox.outputs.firefox-path }}
          NANQUIM_BROWSER_ARTIFACTS: test-results/browser/firefox-${{ matrix.channel }}

      - name: Preserve Firefox failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-firefox-${{ matrix.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser/firefox-${{ matrix.channel }}/
          if-no-files-found: ignore
          retention-days: 14
